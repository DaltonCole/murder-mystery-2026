[package]
name = "bots"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Bot players that drive a real Murder Mystery 2026 server over its actual
# websocket protocol (not the engine directly, that's `sim`'s job) -- see
# `src/lib.rs` for why this exists and how it mirrors game-changer's own
# `examples/simulate_party.rs` + `tests/api_integration.rs` bot pattern.
[dependencies]
engine = { path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"

[[bin]]
name = "bots"
path = "src/main.rs"
