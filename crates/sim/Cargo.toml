[package]
name = "sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Headless full-game simulation harness: drives `engine::apply_command`
# through entire games with no networking and no browser. See the
# "Testing Strategy" section of the implementation plan.
[dependencies]
engine = { path = "../engine" }

[[bin]]
name = "sim"
path = "src/main.rs"
